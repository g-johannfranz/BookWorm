<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookWorm Log-in Portal</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <!-- jQuery Validate plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- External CSS -->
  <link rel="stylesheet" href="styles-login.css">
</head>
<body>

  <div class="center-container">
    <form id="loginForm">
      <h2 class="form-title">BookWorm</h2>

      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" placeholder="Enter username">
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter password">
      </div>

      <button type="submit">Log In</button>

      <div class="register-section">
        <p>No account yet?</p>
        <a href="register.html" class="register-link">Create an account!</a>
      </div>
    </form>
  </div>

  <script>
    $(function(){
      $("#loginForm").validate({
        rules: {
          username: {
            required: true,
            minlength: 4
          },
          password: {
            required: true,
            minlength: 6
          }
        },
        messages: {
          username: {
            required: "Username is required",
            minlength: "Username must be at least 4 characters"
          },
          password: {
            required: "Password is required",
            minlength: "Password must be at least 6 characters"
          }
        },
        highlight: function(element) {
          $(element).addClass("error").removeClass("valid");
        },
        unhighlight: function(element) {
          $(element).addClass("valid").removeClass("error");
        },
        submitHandler: function(form) {
          // Redirect to landing page
          window.location.href = "landing_page.html";
        }
      });
    });
  </script>

</body>
</html>
